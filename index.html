<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f7f7f5"
    >

    <!-- PWA -->
    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <!-- Apple PWA -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Tutor Manager"
    >

    <!-- Apple Home Screen Icon -->
    <link
        rel="apple-touch-icon"
        sizes="192x192"
        href="./icon-home-192.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="512x512"
        href="./icon-home-512.png"
    >

    <!-- PWA Manifest -->
    <link
        rel="manifest"
        href="./manifest.json"
    >

    <!-- App stylesheet -->
    <link
        rel="stylesheet"
        href="./styles.css"
    >

    <title>Tutor Manager</title>

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

</head>


<body>


    <!-- =====================================
         OFFLINE BANNER
    ====================================== -->

    <div
        id="offlineBanner"
        role="status"
        aria-live="polite"
    >

        <span>●</span>

        Offline mode

    </div>


    <!-- =====================================
         APP LOADING
    ====================================== -->

    <div id="appLoading">

        <div class="loading-box">

            <div class="loading-logo">
                TM
            </div>

            <div class="loading-title">
                Tutor Manager
            </div>

            <div class="loading-subtitle">
                Loading your workspace…
            </div>

        </div>

    </div>


    <!-- =====================================
         OFFLINE / ONLINE DETECTION
    ====================================== -->

    <script>

        function updateOfflineStatus() {

            const banner =
                document.getElementById(
                    "offlineBanner"
                );


            if (!banner) {
                return;
            }


            if (navigator.onLine) {

                banner.classList.remove(
                    "show"
                );


                if (
                    typeof window.syncOfflineData ===
                    "function"
                ) {

                    window.syncOfflineData();

                }

            } else {

                banner.classList.add(
                    "show"
                );

            }

        }


        window.addEventListener(
            "online",
            updateOfflineStatus
        );


        window.addEventListener(
            "offline",
            updateOfflineStatus
        );


        window.addEventListener(
            "load",
            function () {

                updateOfflineStatus();


                /*
                 * Register Service Worker
                 */

                if (
                    "serviceWorker" in
                    navigator
                ) {

                    navigator.serviceWorker
                        .register(
                            "./sw.js",
                            {
                                scope: "./"
                            }
                        )
                        .then(
                            registration => {

                                console.log(
                                    "Tutor Manager Service Worker registered:",
                                    registration.scope
                                );

                            }
                        )
                        .catch(
                            error => {

                                console.error(
                                    "Service Worker registration failed:",
                                    error
                                );

                            }
                        );

                }

            }
        );

    </script>


    <!-- =====================================
         MAIN APPLICATION
    ====================================== -->

    <script
        src="./app.js"
        defer
    ></script>


</body>

</html>

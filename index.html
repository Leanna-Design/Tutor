<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f7f7f5"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Tutor Manager"
    >

    <title>Tutor Manager</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <link
        rel="stylesheet"
        href="./styles.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>
</head>

<body>

    <div id="offlineBanner">
        <span>●</span>
        Offline mode
    </div>

    <div id="appLoading">
        <div class="loading-box">
            <div class="loading-logo">TM</div>
            <div class="loading-title">
                Tutor Manager
            </div>
            <div class="loading-subtitle">
                Loading your workspace…
            </div>
        </div>
    </div>

    <script>

        window.addEventListener(
            "online",
            function () {

                const banner =
                    document.getElementById(
                        "offlineBanner"
                    );

                if (banner) {
                    banner.classList.remove("show");
                }

                if (
                    typeof window.syncOfflineData ===
                    "function"
                ) {
                    window.syncOfflineData();
                }

            }
        );


        window.addEventListener(
            "offline",
            function () {

                const banner =
                    document.getElementById(
                        "offlineBanner"
                    );

                if (banner) {
                    banner.classList.add("show");
                }

            }
        );


        window.addEventListener(
            "load",
            function () {

                if (!navigator.onLine) {

                    const banner =
                        document.getElementById(
                            "offlineBanner"
                        );

                    if (banner) {
                        banner.classList.add("show");
                    }

                }


                if (
                    "serviceWorker" in navigator
                ) {

                    navigator.serviceWorker
                        .register("./sw.js")
                        .catch(function (error) {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        });

                }

            }
        );

    </script>


    <script
        src="./app.js"
        defer
    ></script>

</body>
</html>
